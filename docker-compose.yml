version: '3.8'
services:
  api:
    build:
      context: .
      dockerfile: NetZeroGateway.API/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=host.docker.internal;Port=5432;Database=NetZeroGateway;Username=postgres;Password=postgres
      - Jwt__Key=CHANGE_THIS_IN_PRODUCTION
      - Encryption__Key=CHANGE_THIS_IN_PRODUCTION
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
